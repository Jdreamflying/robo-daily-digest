name: Build and publish robotics digest

on:
  workflow_dispatch:
  schedule:
    - cron: "37 23 * * *"

concurrency:
  group: daily-digest-pages
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    outputs:
      date: ${{ steps.build.outputs.date }}
      ref: ${{ steps.archive.outputs.ref }}
      site_url: ${{ steps.pages.outputs.base_url }}
      published: ${{ steps.archive.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: digest-api-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: digest-api-v1-
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Build today's digest
        id: build
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          FILTER_MODEL: ${{ vars.FILTER_MODEL }}
          EDITOR_MODEL: ${{ vars.EDITOR_MODEL }}
          EDITOR_MAX_TOKENS: ${{ vars.EDITOR_MAX_TOKENS }}
          API_DELAY_SECONDS: ${{ vars.API_DELAY_SECONDS }}
          OPENAI_JSON_MODE: ${{ vars.OPENAI_JSON_MODE }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          NOTIFY_ENABLED: "false"
        run: |
          day=$(python -m digest_common)
          echo "date=$day" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == schedule ]] &&
            python -c 'import json, sys; from pathlib import Path; p = Path(sys.argv[1]); sys.exit(not (p.is_file() and json.loads(p.read_text(encoding="utf-8")).get("mode") == "api"))' "data/$day/papers.json"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "API edition for $day already exists."
            exit 0
          fi
          bash ./run.sh --date "$day"
      - name: Persist the archive
        id: archive
        if: steps.build.outputs.skip != 'true'
        env:
          ISSUE_DATE: ${{ steps.build.outputs.date }}
          ARCHIVE_BRANCH: ${{ github.event.repository.default_branch }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          edition="data/$ISSUE_DATE"
          archive_root=$(mktemp -d)
          for attempt in 1 2 3; do
            git fetch origin "+refs/heads/$ARCHIVE_BRANCH:refs/remotes/origin/$ARCHIVE_BRANCH"
            archive="$archive_root/attempt-$attempt"
            git worktree add --detach "$archive" "refs/remotes/origin/$ARCHIVE_BRANCH"
            if [[ "$GITHUB_EVENT_NAME" == schedule ]] &&
              python -c 'import json, sys; from pathlib import Path; p = Path(sys.argv[1]); sys.exit(not (p.is_file() and json.loads(p.read_text(encoding="utf-8")).get("mode") == "api"))' "$archive/$edition/papers.json"; then
              echo "API edition for $ISSUE_DATE was published while generating."
              exit 0
            fi
            git -C "$archive" rm -r --ignore-unmatch -- "$edition"
            mkdir -p "$archive/data"
            cp -a "$edition" "$archive/data/"
            (
              cd "$archive"
              python -m to_web.build_index
              git add -A -- "$edition" data/index.json rss.xml
              if ! git diff --cached --quiet; then
                git -c user.name="github-actions[bot]" \
                  -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                  commit -m "Update robotics digest for $ISSUE_DATE"
              fi
            )
            if git -C "$archive" push origin "HEAD:refs/heads/$ARCHIVE_BRANCH"; then
              echo "ref=$(git -C "$archive" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              echo "path=$archive" >> "$GITHUB_OUTPUT"
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Could not push the archive after three attempts." >&2
          exit 1
      - name: Stage the static site
        if: steps.archive.outputs.published == 'true'
        working-directory: ${{ steps.archive.outputs.path }}
        run: |
          mkdir -p _site/data
          cp index.html news.html manifest.json rss.xml .nojekyll _site/
          cp -R assets _site/
          cp data/index.json _site/data/
          cp -R data/????-??-?? _site/data/
      - uses: actions/upload-pages-artifact@v3
        if: steps.archive.outputs.published == 'true'
        with:
          path: ${{ steps.archive.outputs.path }}/_site

  deploy:
    needs: generate
    if: needs.generate.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  notify:
    if: vars.NOTIFY_ENABLED == 'true' && needs.deploy.result == 'success'
    needs: [generate, deploy]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.generate.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Notify after deployment
        env:
          ISSUE_DATE: ${{ needs.generate.outputs.date }}
          SITE_URL: ${{ needs.generate.outputs.site_url }}
          NOTIFY_ENABLED: ${{ vars.NOTIFY_ENABLED }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: python -m to_web.notify --date "$ISSUE_DATE"
